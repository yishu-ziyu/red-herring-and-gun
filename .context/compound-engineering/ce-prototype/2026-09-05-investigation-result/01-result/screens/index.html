const cases=[library,simple('museum','2026-09-04 15:16','河岸博物馆以后每个周一都开放。','周一开放只适用于公告列出的假期。','公告写的是国庆假期临时安排，不能推广到全年每个周一。','河岸博物馆','国庆假期期间周一正常开放，假期结束后恢复每周一闭馆。'),simple('campus','2026-09-03 09:28','松林大学周末可以随时进去参观。','可以周末参观，但需要提前预约。','开放时段和预约要求同时写在通知中，“随时进去”省略了条件。','松林大学','周末预约访客可于9:00—17:00入校，须提前一天完成预约。'),simple('photo','2026-09-02 20:07','这张广场照片拍摄于今年夏天。','照片至少在2023年已经公开出现。','找到的旧展览图录包含同一幅照片，但首次拍摄日期仍不清楚。','河岸影像馆','夏日广场。收录于2023年秋季展览图录，拍摄日期未注明。'),simple('market','2026-09-01 18:34','南街夜市所有摊位都营业到凌晨两点。','凌晨两点是餐饮区的最晚时间。','手作区和餐饮区的营业安排不同，公告没有说所有摊位必须开到两点。','南街夜市','餐饮区最晚营业至02:00；手作区营业至22:00，各摊位可提前结束营业。')];
let dossierOpen=false;let current=library,mode='grouped',scenario='partial',reopened=false,view='result',newInput=false,timer;
function notice(text){clearTimeout(timer);$('#toast').textContent=text;timer=setTimeout(()=>$('#toast').textContent='',3800)}
function sources(){if(scenario==='complete'&&current.id==='library')return [current.sources[0],{...current.sources[1],title:'读者借阅须知（2026版）',date:'2026-09-01',note:'本示例假设补查取得当前版本，明确普通区可借、参考书仅供馆内阅览。'}];return current.sources}
function cite(n){return `<button class="cite" data-source="${n-1}" aria-label="查看出处 ${n}">出处 ${n}</button>`}
function exchange(n){const done=n===0||scenario==='complete',full=scenario==='complete';return `<details class="exchange"><summary><span class="status ${done?'':'pending'}">${done?'已回应':'未完成'}</span><span><span class="summary-title">${n===0?'24小时开放，指的是全馆吗？':'旧版借阅须知，还适用于今年吗？'}</span><span class="summary-note">${n===0?'补查明确了区域，已收窄判断':full?'找到当前版本，已补充外借限制':'未找到当前版本，保留未知'}</span></span><span class="arrow">›</span></summary><div class="exchange-body"><div class="exchange-step"><small>独立意见提出的问题</small><p>${n===0?'最初判断把“图书馆”整体写成24小时开放。通知是否只适用于某个区域？':'这份借阅规定发布于2024年。是否有2026年的现行规则，足以判断“所有图书”能否外借？'}</p></div><div class="exchange-step"><small>补查的出处</small><p>${n===0?'找到通知全文，自助阅览室与主馆的开放时间被分别列出。 '+cite(1):full?'找到本轮适用的借阅规定，普通借阅区和馆内阅览文献分别列明。 '+cite(2):'补查未找到现行版本；保留已取得的旧版须知。 '+cite(2)}</p></div>${done?`<div class="exchange-step"><small>主调查回应</small><p>${n===0?'原先把局部开放扩大到了全馆。依据通知，将判断改为“只有自助阅览室24小时开放”。':'依据补查的现行规则，普通图书免费外借；参考书等仍限馆内阅览。“所有图书”不成立。'}</p></div><div class="change">${n===0?'判断已修改 · 从“全馆全天开放”收窄到“自助阅览室全天开放”。':'判断已补充 · 从“借阅范围待确认”更新为“部分文献仅限馆内阅览”。'}</div>`:'<div class="unfinished">尚未完成主调查回应。现有材料不足以确认2026年的全部借阅范围，保留“未能证实”。</div>'}</div></details>`}
function exchanges(){if(current.id!=='library'||scenario==='none')return '<p class="empty">这次独立复核未提出具体质询。</p>';if(scenario==='legacy')return '<p class="empty">这份旧报告没有保存质询记录，无法回看当时是否提出过质询。</p>';return exchange(0)+exchange(1)}
function title(){return scenario==='complete'&&current.id==='library'?'24小时开放的只有自助阅览室；参考书等文献仍不能外借。':current.title}
function renderHistory(){$('#history').innerHTML=cases.filter(c=>!(['failed','stopped'].includes(scenario)&&c.id===current.id)).map(c=>`<button class="${current.id===c.id?'current':''}" data-case="${c.id}"><span>${esc(c.claim)}</span><time>${c.date.slice(5,10)} · ${c.date.slice(11)}</time></button>`).join('')}
function render(){renderHistory();renderDossier();$('.rail-footer').innerHTML=scenario==='sync'?'示例账户 · 已登录<br>本机已保存，账户同步失败':'访客 · 这台浏览器的调查<br>示例与真实历史分开';$('#header-name').textContent=reopened?'历史调查':'调查结果';if(view==='input'){renderInput();return}const normal=current.id==='library';$('#reading').innerHTML=`<blockquote class="claim">${esc(current.claim)}</blockquote>${reopened?`<div class="reopen">原调查时间：${current.date} · 本次未重新核查。<br>你正在阅读当时保存的结果。</div>`:''}<details class="process-old"><summary>✓ 核查过程 <span class="run-pill">已结束 · 示例</span><span>⌄</span></summary><p>此处保留原有过程入口。原型没有真实执行轨迹。</p></details><div class="report-meta"><span>${current.date}</span><span>·</span><span class="${['failed','sync','stopped'].includes(scenario)?'quiet':'saved'}">${scenario==='failed'?'尚未保存':scenario==='sync'?'已保存在本机':scenario==='stopped'?'调查未完成':'已留存 · 示例'}</span></div>${scenario==='failed'?'<div class="error" role="alert">保存到本机失败。当前结果仍可阅读，请重试保存。<button id="retry-save">重试保存</button></div>':scenario==='sync'?'<div class="error" role="alert">账户历史同步失败，暂时无法跨设备找回。<button id="retry-sync">重试同步</button></div>':''}<h1><span>${scenario==='stopped'?'这次调查还没完成。':esc(title())}</span></h1><p class="lead">${scenario==='stopped'?'已找到开放时间通知，但尚未完成全部核查。现有材料保留如下，可以重新核查。':esc(scenario==='complete'&&normal?'最新借阅规则也明确了外借限制。原句把部分区域的开放安排和部分图书的借阅权限扩大到了全部。':current.lead)}</p>${scenario==='stopped'?'':`<section class="report-section"><div class="section-title"><h2>原句的问题在哪里</h2></div>${current.points.map((p,i)=>`<div class="point"><h3>${i+1}. ${esc(scenario==='complete'&&normal&&i===1?'参考书等文献仅限馆内阅览':p[0])}</h3><p>${esc(scenario==='complete'&&normal&&i===1?'补查的2026版规则仍将参考书等列为馆内阅览，免费外借限于普通借阅区。':p[1])} ${cite(p[2])}</p>${mode==='inline'&&normal&&!['none','legacy'].includes(scenario)?`<div class="inline-exchange">${exchange(i)}</div>`:''}</div>`).join('')}</section>${mode==='grouped'||!normal||['none','legacy'].includes(scenario)?`<section class="report-section"><div class="section-title"><h2>${['none','legacy'].includes(scenario)||!normal?'质询记录':'这次质询澄清了什么'}</h2><small>${normal&&!['none','legacy'].includes(scenario)?scenario==='complete'?'2 项已回应':'1 项已回应 · 1 项未完成':''}</small></div>${exchanges()}</section>`:''}`}<section class="report-section"><div class="section-title"><h2>出处</h2><small>${sources().length} 份材料</small></div>${sources().map((s,i)=>`<button class="source-row" data-source="${i}"><span class="num">0${i+1}</span><span><strong>${s.title}</strong><small>${s.publisher} · ${s.date}</small></span><span class="arrow">↗</span></button>`).join('')}</section><div class="report-actions"><span class="quiet" style="font-size:12px">调查日期 ${current.date.slice(0,10)}</span><button id="recheck">重新核查这句话 ↗</button></div><form class="follow" id="follow"><label for="follow-input">继续问这条材料</label><div class="follow-box"><input id="follow-input" placeholder="例如：通知里具体写了哪个区域？" required><button type="submit">追问 ↑</button></div></form><p class="sample-note">内容、机构及出处均为虚构的界面样例。你在这里判断呈现方式；真实质询效果与调查留存另行验证。</p>`}
function sourceOpen(i){const s=sources()[i];$('#source-content').innerHTML=`<div class="dialog-head"><div><span class="quiet mono">出处 0${i+1} / 示例材料</span><h2 style="margin-top:12px">${s.title}</h2></div><button data-close="source-dialog" aria-label="关闭出处">×</button></div><p class="quiet" style="font-size:12px">${s.publisher}<br>发布时间 ${s.date}</p><blockquote class="source-quote">${s.quote}</blockquote><h3>这份材料能说明什么</h3><p class="source-comment">${s.note}</p><button id="source-original">打开示例原文 ↗</button><p class="sample-note">这是本地构造的原文片段，不是真实机构的调查证据。</p>`;$('#source-dialog').showModal();$('#source-original').onclick=()=>{$('#source-content').innerHTML=`<div class="dialog-head"><h2>示例原文</h2><button data-close="source-dialog" aria-label="关闭出处">×</button></div><p class="quiet">${s.publisher} · ${s.date}</p><h2>${s.title}</h2><blockquote class="source-quote">${s.quote}</blockquote><p>以上为这份示例文档的完整内容。</p><p class="sample-note">构造材料，仅用于原型。</p>`}}
function renderInput(){const val=newInput?'':current.claim;$('#reading').innerHTML=`<div class="composer"><span class="quiet">${newInput?'新调查':'重新核查 · 原调查保留'}</span><h1>把你想核查的话放进来。</h1><form id="intake"><label for="claim-input">你想核查什么？</label><textarea id="claim-input" required>${esc(val)}</textarea><button class="primary">开始核查</button> <button type="button" id="return-result">返回原调查</button></form><p class="sample-note">呈现演示：不会调用真实模型或搜索。修改句子后只展示启动状态，不生成虚构答案。</p></div>`}
function startDemo(){const claim=$('#claim-input').value;$('#action-content').innerHTML=`<div class="dialog-head"><h2>查证已启动 · 演示</h2><button data-close="action-dialog" aria-label="关闭操作">×</button></div><blockquote class="claim" style="margin:0">${esc(claim)}</blockquote><p>正式接入后，将按这次提交重新查证。旧调查与原日期保留。</p><div class="unfinished">此处演示停在启动状态，没有发起真实调查。</div><div class="dialog-buttons"><button data-close="action-dialog">返回输入</button></div>`;$('#action-dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){mode=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.layout===mode));render()}if(b.dataset.case){current=cases.find(c=>c.id===b.dataset.case);reopened=true;view='result';scenario=current.id==='library'?'partial':'none';$('#scenario').value=scenario;$('#rail').classList.remove('open');render();setDossier(true);window.scrollTo(0,0)}if(b.dataset.source!==undefined)sourceOpen(Number(b.dataset.source));if(b.dataset.close)$('#'+b.dataset.close).close();if(b.id==='new'||b.id==='recheck'){newInput=b.id==='new';view='input';setDossier(false);$('#rail').classList.remove('open');render();window.scrollTo(0,0)}if(b.id==='return-result'){view='result';render()}if(b.id==='history-open')$('#rail').classList.add('open');if(b.classList.contains('mobile-close'))$('#rail').classList.remove('open');if(b.id==='open-dossier'){setDossier(!dossierOpen)}if(b.id==='dossier-close'){setDossier(false)}if(b.id==='retry-save'||b.id==='retry-sync')notice('这是失败状态演示，没有执行真实保存或同步。');if(b.id==='mobile-preview')window.open('mobile.html','_blank');if(b.id==='open-old'){$('#action-dialog').close();view='result';reopened=true;scenario=current.id==='library'?'partial':'none';$('#scenario').value=scenario;render()}if(b.id==='confirm-new'){$('#action-dialog').close();startDemo()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='follow'){notice('已进入追问演示；正式接入后在这份调查中继续查证。');return}if(e.target.id==='intake'){const claim=$('#claim-input').value.trim().replace(/\s+/g,' '),match=cases.find(c=>c.claim.trim().replace(/\s+/g,' ')===claim);if(match){current=match;$('#action-content').innerHTML=`<div class="dialog-head"><h2>这句话以前查过</h2><button data-close="action-dialog" aria-label="关闭操作">×</button></div><p>${esc(match.claim)}</p><p class="quiet">调查时间 ${match.date}</p><p>打开旧调查可直接阅读当时的结果；重新核查会重新查证，旧记录保留。</p><div class="dialog-buttons"><button id="open-old" class="primary">打开旧调查</button><button id="confirm-new">重新核查</button></div>`;$('#action-dialog').showModal()}else startDemo()}});

function setDossier(open){dossierOpen=open;$('#layout').classList.toggle('with-dossier',open);$('#dossier').hidden=!open;renderDossier()}
function renderDossier(){if(!$('#dossier-paper'))return;$('#dossier-paper').innerHTML=`<div class="report-meta">${current.date} · ${reopened?'原调查':'本次调查'} · 示例</div><h2 style="margin:18px 0">${esc(scenario==='stopped'?'这次调查还没完成。':title())}</h2><span class="document-label">结论</span><p>${esc(scenario==='stopped'?'已取得的材料保留如下，尚未完成全部核查。':scenario==='complete'&&current.id==='library'?'现行规则明确了开放区域和外借限制。原句将部分适用范围扩大到了全部。':current.lead)}</p>${scenario==='failed'?'<div class="error">保存到本机失败。</div>':scenario==='sync'?'<div class="error">账户同步失败，本机记录保留。</div>':''}<h3>逐条核查</h3>${scenario==='stopped'?'':current.points.map((p,i)=>`<div class="point"><h3>${esc(scenario==='complete'&&current.id==='library'&&i===1?'参考书等文献仅限馆内阅览':p[0])}</h3><p>${esc(scenario==='complete'&&current.id==='library'&&i===1?'补查的2026版规则仍将参考书等列为馆内阅览，免费外借限于普通借阅区。':p[1])} ${cite(p[2])}</p></div>`).join('')}${scenario!=='stopped'?'<h3>质询与回应</h3>'+exchanges():''}<div class="document-source"><h3>出处</h3>${sources().map((s,i)=>`<button class="source-row" data-source="${i}"><span>${s.title}<small>${s.date} · 示例材料</small></span><span class="arrow">↗</span></button>`).join('')}</div><button id="recheck">重新核查这句话 ↗</button><p class="sample-note">本地呈现样例，不代表真实调查。</p>`}
$('#scenario').onchange=e=>{scenario=e.target.value;current=library;view='result';reopened=scenario==='legacy';render()};render();
</script></body></html>
