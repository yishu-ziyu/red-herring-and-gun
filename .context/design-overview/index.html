<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红鲱鱼与枪 · 现有设计与界面总览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#242422;font:15px/1.6 system-ui,-apple-system,sans-serif}header,main{max-width:1440px;margin:auto;padding:28px 36px}header{padding-bottom:16px}h1{font-size:30px;line-height:1.3;margin:6px 0 12px}p{margin:8px 0;color:#65645f}small{color:#65645f}button,input,a{font:inherit}button,a{cursor:pointer}button{background:white;border:1px solid #d5d3cd;border-radius:6px;padding:8px 12px;color:inherit}button:hover,a:hover{color:#9b512c;border-color:#9b512c}button[aria-pressed=true]{background:#252824;color:white;border-color:#252824}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}input{width:100%;padding:12px 14px;border:1px solid #d5d3cd;border-radius:6px;background:white;margin:16px 0 0}main{padding-top:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;min-width:0;background:white;border:1px solid #dedcd6;border-radius:8px;overflow:hidden;text-align:left;padding:0}.card img{width:100%;height:220px;object-fit:contain;object-position:top;background:#eae8e2;border-bottom:1px solid #e3e1db}.tile{height:110px;padding:20px;background:#eeece5;display:flex;flex-direction:column;justify-content:center}.tile strong{font-size:21px}.body{padding:16px;flex:1}.body h3{font-size:16px;line-height:1.5;margin:5px 0}.path{font:11px/1.5 ui-monospace,monospace;color:#77766f;overflow-wrap:anywhere;margin-top:12px}.tag{font-size:11px;color:#926044}.note{font-size:12px;color:#74736c;margin:6px 0 0}#count{margin:12px 0}dialog{width:calc(100vw - 32px);height:calc(100vh - 32px);max-width:none;max-height:none;border:1px solid #c9c7c0;border-radius:10px;padding:0;background:#eeeae3;color:#242422}dialog::backdrop{background:#171914b8}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;background:white;border-bottom:1px solid #ddd}.toolbar strong{margin-right:auto}.toolbar a{color:inherit}.detail{font-size:12px;margin:0;padding:8px 18px;background:#f8f7f3;overflow-wrap:anywhere}#stage{height:calc(100% - 110px);overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}iframe{border:0;background:white;width:100%;height:100%;min-height:500px;flex-shrink:0}#stage img{max-width:100%;height:auto;background:white}pre{margin:0;padding:24px;background:white;white-space:pre-wrap;word-break:break-word;max-width:1100px;width:100%;font:14px/1.75 ui-monospace,monospace}.empty{padding:40px}footer{margin:32px 0;color:#777;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header,main{padding:20px 16px}.grid{grid-template-columns:1fr}h1{font-size:25px}.toolbar{padding:10px;gap:6px}.toolbar strong{width:100%}#stage{padding:4px}.card img{height:240px}}
</style>
<header><small>项目文件原件 · 2026-09-05 盘点</small><h1>现有设计与界面总览</h1><p>你已认可「零件展示：要 / 不要」和「用户路径走查：桌面与手机」的设计，已置顶。其他旧界面稿已删除；当前前端、结果页修正版及设计说明按类别保留。</p><p><b>当前产品：mvp</b>　·　<b>新版开发：packages/web</b>　·　今天的结果页原型仍待你认可。</p><input id="search" type="search" placeholder="搜索名称或文件路径，例如：home、mobile、ResearchMemo" aria-label="搜索名称或文件路径"><nav id="filters" aria-label="材料分类"></nav></header>
<main><p id="count" aria-live="polite"></p><div id="grid" class="grid"></div><footer>保留范围：两份认可设计及配图、当前前端、结果页修正版、品牌资源与现行说明。旧界面 HTML、未选用截图和参考视频已按用户要求删除。路演与技术决策记录未参与此次清理，也不再混入界面总览。</footer></main>
<dialog id="viewer"><div class="toolbar"><strong id="title"></strong><button id="desktop">完整宽度</button><button id="narrow">390px</button><a id="original" target="_blank" rel="noopener">打开原件 ↗</a><button id="close">关闭</button></div><p id="detail" class="detail"></p><div id="stage"></div></dialog>
<script>
let items=[],category='先看这些',active;const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const file=p=>'/files/'+p.split('/').map(encodeURIComponent).join('/');
const thumbs={'新版 · 完成结果':'packages/web/output/show-me-walk/09-done.png','既有用户路径走查：桌面与手机':'packages/web/output/show-me-walk/01-home.png'};
function render(){let q=$('#search').value.toLowerCase();let shown=items.filter(i=>(q||category==='全部'||(category==='先看这些'?i.featured:i.group===category))&&(!q||(i.title+' '+i.path+' '+i.group).toLowerCase().includes(q)));$('#count').textContent=(q?'搜索结果':category)+' · '+shown.length+' 项 / 共 '+items.length+' 项';$('#grid').innerHTML='';for(const i of shown){const b=document.createElement('button');b.className='card';let src=i.kind==='image'?i.path:thumbs[i.title];b.innerHTML=(src?'<img loading="lazy" src="'+file(src)+'" alt="'+esc(i.title)+(i.kind==='image'?'':'（历史截图缩略图）')+'">':'<div class="tile"><small>'+esc(i.group)+'</small><strong>'+({live:'打开现有页面',html:'查看原始 HTML',text:'阅读原文',download:'查看原始文件'}[i.kind]||'')+'</strong></div>')+'<div class="body"><span class="tag">'+esc(i.group)+(thumbs[i.title]?' · 缩略图为历史记录':'')+'</span><h3>'+esc(i.title)+'</h3><p class="note">'+esc(i.note)+'</p><div class="path">'+esc(i.path)+'</div></div>';b.onclick=()=>openItem(i);$('#grid').append(b)}if(!shown.length)$('#grid').innerHTML='<p class="empty">没有匹配的文件。</p>';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.textContent.split(' · ')[0]===category&&!q));}
async function openItem(i){active=i;$('#title').textContent=i.title;$('#detail').textContent=i.note+' ｜ '+i.path;$('#original').href=i.url||file(i.path);$('#stage').innerHTML='';$('#viewer').showModal();$('#stage').scrollTop=0;const isPage=['html','live'].includes(i.kind);$('#desktop').hidden=$('#narrow').hidden=!isPage;if(i.kind==='image'){let el=document.createElement('img');el.src=file(i.path);el.alt=i.title;$('#stage').append(el)}else if(isPage){let el=document.createElement('iframe');el.title=i.title;if(i.kind==='html')el.setAttribute('sandbox','allow-scripts allow-popups');el.src=i.url||file(i.path);$('#stage').append(el)}else if(i.kind==='text'){let el=document.createElement('pre');el.textContent='读取中…';$('#stage').append(el);let txt=await(await fetch(file(i.path))).text();if(active===i)el.textContent=txt}else{let el=document.createElement('p');el.textContent='此格式请通过「打开原件」下载并用对应应用查看。';$('#stage').append(el)}}
function close(){active=null;$('#viewer').close();$('#stage').innerHTML=''}$('#close').onclick=close;$('#viewer').addEventListener('cancel',()=>{$('#stage').innerHTML='';active=null});$('#desktop').onclick=()=>{$('#stage iframe').style.width='100%'};$('#narrow').onclick=()=>{$('#stage iframe').style.width='390px'};$('#search').oninput=render;
fetch('/manifest.json').then(r=>r.json()).then(data=>{items=data;let cats=['先看这些','认可的设计','当前产品','新版开发','本轮待评原型','认可稿配图','设计说明与存档','界面源码','品牌与图标','全部'];for(const c of cats){let b=document.createElement('button');b.textContent=c;b.onclick=()=>{category=c;$('#search').value='';render()};$('#filters').append(b)}render()});
</script></html>
