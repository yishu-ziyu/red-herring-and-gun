name: Public SSE browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps
      - run: npm ci
        working-directory: apps/server
      - run: npm run build
        working-directory: apps
      - run: npm ci --prefix scripts/acceptance/browser-tools --ignore-scripts
        working-directory: apps
      - run: node scripts/acceptance/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
        working-directory: apps
      - name: Verify old implementation security failure
        if: github.event_name == 'pull_request'
        env:
          # Fixed vulnerable control: future PR bases may already contain the repair.
          RHG_BASE_SHA: 7110c850059b876b5345aab13d618e4d60165e3b
        run: node scripts/acceptance/check-old-browser.mjs
        working-directory: apps
      - run: npx --no-install vitest run --config scripts/acceptance/vitest.browser.config.ts
        working-directory: apps
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-sse-browser-evidence
          path: out/public-sse-browser/
          if-no-files-found: warn
