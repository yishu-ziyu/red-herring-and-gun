# gun.yishuziyu.cn：前端静态文件 + 反代到本机 3000 的后端。
# 放到 /etc/nginx/conf.d/red-herring.conf。同机的 yishuziyu.cn 在另一份配置里，互不影响。
# 证书：certbot certonly --webroot -w /var/www/certbot -d gun.yishuziyu.cn
server {
    listen 80;
    listen [::]:80;
    server_name gun.yishuziyu.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gun.yishuziyu.cn;

    ssl_certificate     /etc/letsencrypt/live/gun.yishuziyu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gun.yishuziyu.cn/privkey.pem;

    # 后端收 10 MB 的 JSON（截图转成文本后变大），这里留一点余量。
    client_max_body_size 12m;

    root /opt/red-herring/web;
    index index.html;

    # 核查进度用 SSE 推送：必须关缓冲，否则进度冻住、结尾一次性吐出。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 分享页由后端渲染，不代理会被下面的前端兜底吞掉。
    location /s/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # 带哈希的构建产物可以长缓存；index.html 和 sw.js 不缓存，发布后立刻生效。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
