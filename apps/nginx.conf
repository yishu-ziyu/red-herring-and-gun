server {
    listen 80;
    server_name gun.yishuziyu.cn;

    # SSE 流式核查：必须关缓冲，否则 nginx 攒满 proxy_buffers 才吐给浏览器，
    # 用户看到的是进度冻结 + 结尾一次性 dump。
    location /api/agent/orchestrate-stream {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 代理
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 分享页由 Express 渲染，不代理会被 SPA 兜底吞掉，显示「分享链接不可用」
    location /s/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查由 Express 提供，不代理会被 SPA 兜底吞掉
    location = /health {
        proxy_pass http://localhost:3000;
    }

    # 静态文件
    location / {
        root /opt/red-herring/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
