function roleGroup(compact=false){const active=Math.min(steps,3);const done=['已拆出问题','已带回材料','已核对范围','已完成判断'];const doing=['拆分问题中','查找出处中','核对范围中','形成判断中'];return `<div class="roles ${compact?'compact':''}">${ROLES.map((src,i)=>`<div class="role ${compact&&i===active?'active':''}"><img class="avatar" src="${src}" alt="${roleNames[i]}角色插画"><strong>${roleNames[i]}</strong><small>${compact?(i<active?done[i]:i===active?doing[i]:'尚未开始'):roleDescriptions[i]}</small></div>`).join('')}</div>`}

const sourceData={1:{title:'海岬市公园免费开放试点说明',publisher:'虚构：海岬市园林部门',date:'2026-08-28',kind:'教学原文',quote:'自10月1日起，滨海公园、松林公园试行免费开放。开放时间为每日6:00至22:00。',why:'原文限定了两座公园和每日开放时段，不能扩大成所有公园、全天开放。',limit:'不能据此判断其他公园的收费情况，也不能保证试点以后不再调整。'},2:{title:'滨海公园入园提示（旧版）',publisher:'虚构：滨海公园',date:'2025-06-01',kind:'教学原文 · 旧资料',quote:'公园开放时间为每日6:00至22:00，普通入园票价5元。',why:'它与后来的免费试点说明处于不同时间。并列阅读时必须先核对适用日期。',limit:'没有更新日期，不能把它当成试点实施后的现行收费依据。'},3:{title:'便民信息转载：公园开放安排',publisher:'虚构：海岬便民信息',date:'2026-08-29',kind:'教学转载',quote:'据市园林部门试点说明，两座公园将从10月1日起试行免费开放。',why:'这篇转载引用第一份说明，不增加一份独立的政策证据。',limit:'只是转述，不能代替原始通知，也不构成独立核实。'}};

function openSource(id=1){const s=sourceData[id];modal(`${head('材料详情')}<div class="pub-note">虚构案例材料，只用于演示界面，不是网上原文。</div><span class="tag">${s.kind}</span><h3>${s.title}</h3><p class="muted">${s.publisher}<br>示例发表时间：${s.date}</p><div class="source-label">针对哪句话</div><p>“所有公园全天免费开放”</p><div class="source-label">教学文本 · 不是检索摘要</div><blockquote class="source-quote">${s.quote}</blockquote><div class="source-label">这份材料说明什么</div><p>${s.why}</p><div class="source-label">它不能证明什么</div><p>${s.limit}</p><div class="space"></div><button class="btn" disabled>示例没有外部原文链接</button><p class="footnote">生产版本：只有获得可定位的真实原文，才使用“原文摘录”；搜索摘要和模型整理单独标注。</p>`,true)}
function home(){return `<section class="hero"><h1>这句话，<span>站得住吗？</span></h1><p class="sub">放进一句话、一张截图或一个链接。一起查它的出处。</p><div class="composer"><textarea id="claim-input" aria-label="要核查的说法" placeholder="把你拿不准的说法放进来…">${esc(draftStore.getItem('rhg-draft')||'')}</textarea><div id="attachment"></div><div class="composer-footer"><div class="attach"><button data-action="upload">${icon('image')}加一张图</button><button data-action="link">${icon('link')}贴链接</button></div><button class="btn primary" data-action="start">开始调查 ${icon('arrow')}</button></div></div><p class="hint">当前为离线交互原型。输入只留在此浏览器会话，不会上传。</p><div class="examples-inline"><span>或者先看看</span><button data-action="fill">公园真的全部免费了吗？</button><button data-go="examples">一次调查怎样展开</button></div>${roleGroup()}<div class="home-case"><div><h2>不只给结论。<br>把依据一起交给你。</h2><p class="muted small">先看一个案例怎样从一句话，走到可以查验的判断。</p></div><article class="sample"><div class="sample-type">教学案例 · 虚构公园开放通知</div><strong>“所有公园”与“两座试点公园”，<br>差的不只是几个字。</strong><p>对照通知的范围、时段与旧版入园提示。</p><button class="link" data-action="replay">打开案例回放 ${icon('arrow')}</button></article></div></section>`}
function discoveries(){const ds=[{r:0,t:'这句话有三个需要分开核对的部分',p:'是否免费、哪些公园、每天什么时候开放。',s:null},{r:1,t:'找到了具体的开放范围',p:'说明提到滨海、松林两座公园，而不是所有公园。',s:1},{r:2,t:'“全天”与材料中的时间不一致',p:'教学原文写的是 6:00—22:00。旧入园提示还需要按日期区分。',s:2}];return ds.slice(0,steps).map((d,i)=>`<article class="discovery"><img src="${ROLES[d.r]}" alt=""><div class="discovery-content"><strong>${d.t}</strong><p>${d.p}</p>${d.s?`<button class="source-chip" data-source="${d.s}">${icon('file')}${sourceData[d.s].title} ${icon('arrow',14)}</button>`:''}<div class="discovery-meta">${roleNames[d.r]} · 回放第 ${i+1} 条发现</div></div></article>`).join('')}
function investigation(interrupted=false){return `<div class="page-top"><div class="crumb"><button data-go="home">${icon('back')} 返回首页</button><span>教学案例回放 · 并非正在联网核查</span></div><h1>${interrupted?'这次调查没有查完。':'把说法拆清，把依据找出来。'}</h1><p>${interrupted?'已取得的材料还在。你可以查看它们，或明确重新开始。':'现在关注：通知里的开放范围和时间。'}</p></div><div class="work-grid"><aside><section class="original"><div class="label">交来的说法</div><blockquote>“${claim}”</blockquote><div class="original-foot">材料类型：文字<br>示例日期：2026-09-11</div></section><section class="questions"><h3>要核对的问题</h3><div class="qrow"><span>01</span>是否开始免费开放？</div><div class="qrow"><span>02</span>包括所有公园吗？</div><div class="qrow"><span>03</span>是全天开放吗？</div></section></aside><section><div class="work-head"><h2>${interrupted?'已保留的调查':'调查工作区'}</h2><span class="live-status"><span class="dot"></span>${interrupted?'回放：已中断':'回放：'+roleNames[Math.min(steps,3)]}</span></div>${interrupted?`<div class="callout"><strong>示例中断：连接未能恢复</strong><p>${steps} 条发现和相关材料已保留，没有生成最终结论。</p></div>`:roleGroup(true)}<div class="section-heading"><h3>最新发现</h3><span class="muted small">${steps} 条 · 均来自示例材料</span></div>${discoveries()}<div class="run-bottom"><span class="small muted">${interrupted?'中断不等于证据不足。':'每条发现都可以回到它的材料。'}</span><div class="row">${interrupted?'<button class="btn primary" data-action="replay">重新回放</button>':'<button class="btn ghost" data-go="interrupted">停止回放</button><button class="btn primary" data-action="next">'+(steps<3?'下一条发现':'查看结果')+'</button>'}</div></div></section></div>`}
function evidence(){return `<article class="evidence-row"><span class="evidence-num">01</span><div><h3>范围只有两座公园，开放时间也有限定。</h3><blockquote>“滨海公园、松林公园试行免费开放。开放时间为每日6:00至22:00。”</blockquote><div class="source-meta">虚构：试点说明 · 2026-08-28 · 教学原文</div></div><button data-source="1">查看材料 ${icon('arrow',14)}</button></article><article class="evidence-row"><span class="evidence-num">02</span><div><h3>旧版收费提示，不能直接作为新试点后的依据。</h3><p>旧提示写“普通入园票价5元”，发布时间早于试点说明。它提醒我们检查时间，而不是直接推翻新通知。</p><div class="source-meta">虚构：公园入园提示 · 2025-06-01 · 适用期需核对</div></div><button data-source="2">查看材料 ${icon('arrow',14)}</button></article>`}
function result(shared=false){return `<div class="doc"><div class="crumb"><button data-go="${shared?'home':'investigation'}">${icon('back')} ${shared?'开始自己的调查':'回到调查过程'}</button><span>教学案例 · 仅演示阅读体验</span></div>${shared?'<div class="pub-note">分享页预览 · 未创建任何公开链接。真实产品仅公开用户明确授权的字段。</div>':''}<div class="verdict-meta"><strong>说法扩大了范围</strong><span>3 个问题</span><span>2 份关键材料</span><span>原型示例 · 2026-09-11</span></div><h1>只涉及两座试点公园，<br>不是全市，也不是全天。</h1><p class="lead-explanation">示例通知支持“部分公园免费开放”，但没有支持“所有公园”与“全天”。关键差别就在原句的这两个词里。</p><section class="claim-strip"><div class="label">把判断放回原来的话里</div><div class="annotated">海岬市将从下月起，<mark>所有公园</mark><mark>全天</mark><mark class="yes">免费开放</mark>。</div><div class="legend"><span class="bad">下划线：范围不成立</span><span class="good">免费：只在试点范围内有依据</span></div></section><div class="section-heading"><h2>判断的关键依据</h2><button class="link" data-go="conflict">对照两份材料 ${icon('arrow',14)}</button></div>${evidence()}<div class="space"></div><details><summary style="cursor:pointer;font-size:15px;padding:10px 0">展开逐项判断与来源关系</summary><ul class="decision-list"><li><strong class="good">部分有依据</strong><span>免费开放：两座试点公园。</span></li><li><strong class="bad">没有支持</strong><span>所有公园：原文限定了名单。</span></li><li><strong class="bad">与材料不符</strong><span>全天：原文写6:00—22:00。</span></li></ul><p class="small muted" style="margin-top:12px">另有一份转载引用同一通知，不算新的独立证据。</p><button class="link" data-source="3">查看转载关系 ${icon('arrow',14)}</button></details><p class="footnote">判断边界：只对这组虚构材料作演示。不代表任何实际城市政策；不能据此判断其他公园或未来变化。</p><div class="actions">${shared?'<button class="btn primary" data-go="home">调查另一条说法</button>':'<button class="btn primary" data-action="share">分享这份判断</button><button class="btn" data-action="copy">复制带边界的摘要</button><button class="btn ghost" data-action="replay">重新回放</button>'}</div><p class="save-status">${shared?'分享不包含账号、密钥和未授权附件。':'原型状态：未向服务器保存。真实产品的本地/同步状态在这里显示。'}</p></div>`}
function conflict(){return `<div class="crumb"><button data-go="result">${icon('back')} 返回判断</button><span>教学案例 · 虚构材料</span></div><h1>看起来矛盾，先核对时间。</h1><p class="compare-intro">一份材料说免费，一份旧提示仍写收费。先明确它们分别适用于什么时候，不靠“有两种说法”直接下结论。</p><div class="compare-grid">${[1,2].map(id=>{const s=sourceData[id];return `<article class="compare-panel"><span class="tag">${id===1?'材料 A · 新的试点说明':'材料 B · 较早的入园提示'}</span><h2>${s.title}</h2><p class="small muted">${s.publisher} · ${s.date}</p><blockquote>“${s.quote}”</blockquote><dl><div><dt>适用对象</dt><dd>${id===1?'两座试点公园':'滨海公园'}</dd></div><div><dt>时间边界</dt><dd>${id===1?'10月1日起的试点安排':'旧页面，现行适用性未确认'}</dd></div><div><dt>能证明什么</dt><dd>${id===1?'该通知中写了部分免费开放':'曾发布过收费提示'}</dd></div></dl><button class="btn" data-source="${id}">打开${id===1?'左侧':'右侧'}材料 ${icon('arrow',14)}</button></article>`}).join('')}</div><div class="callout"><strong>目前能说明：两份材料的时间不同。</strong><p>“旧页面是否仍然有效”在示例中没有独立验证。不要把旧收费信息与新通知视为两个同等有效、同一时点的结论。</p></div><div class="actions"><button class="btn primary" data-go="result">回到整体判断</button></div>`}
const historyItems=[{title:claim,status:'已完成',date:'2026-09-11',sub:'只涉及两座试点公园，不是全市，也不是全天。',go:'result'},{title:'同一公园案例：中断状态示例',status:'未查完',date:'2026-09-11',sub:'3 条发现与材料已保留；没有最终结论。',go:'interrupted'}];
function history(){return `<div class="doc"><h1>查过的说法。</h1><p class="muted" style="margin-top:12px">打开的是当时的记录，不会重新开始一场调查。</p><input id="history-query" class="history-search" type="search" placeholder="找一条说法…" aria-label="搜索调查历史"><div class="filters">${['全部','已完成','未查完'].map(x=>`<button class="${historyFilter===x?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div><div id="history-items">${historyRows('')}</div><p class="footnote">此页是两条预置状态，不是你的真实历史，也未读取你的账户。</p></div>`}
function historyRows(q){return historyItems.filter(x=>(historyFilter==='全部'||x.status===historyFilter)&&x.title.includes(q)).map(x=>`<article class="history-item"><div><h3>${x.title}</h3><p>${x.sub}</p><p>${x.status} · ${x.date} · 教学示例</p></div><button class="btn slim" data-go="${x.go}">打开 ${icon('arrow',14)}</button></article>`).join('')||'<div class="empty"><h3>没有匹配的示例</h3><p>换一个关键词试试。</p></div>'}
function settings(){return `<div class="page-top"><h1>账号与设置。</h1><p>材料归你，服务状态说清楚。</p></div><div class="settings-grid"><aside class="settings-nav"><button class="selected" data-action="settings-tab">模型服务</button><button data-action="account">账号与数据</button></aside><section class="settings-panel"><div class="settings-section"><h2>选择怎样使用调查服务</h2><p>正式产品显示平台服务与自带密钥的区别。本原型不会校验、保存或发送真实密钥。</p></div><div class="settings-section"><h3>使用自己的模型服务</h3><label class="formfield"><span>服务地址</span><input value="https://provider.example.invalid/v1" readonly aria-label="示例服务地址"></label><label class="formfield"><span>API Key</span><input value="仅演示，不要在原型中输入真实密钥" readonly aria-label="密钥输入示例"></label><label class="formfield"><span>模型名称</span><input value="your-model-name（示例）" readonly aria-label="示例模型名称"></label><div class="row wrap"><button class="btn primary" data-action="validate">验证连接</button><button class="btn" data-action="session">仅本次会话使用</button></div><p class="footnote">实际密钥不进入报告、活动流或分享页。生产实现必须审核已有存储方式与 URL 安全策略。</p></div><div class="row spread"><div><h3>平台服务</h3><p>实际剩余次数与可用性由服务器返回。</p></div><span class="small muted">原型未连接</span></div></section></div>`}
function examples(){return `<div class="page-top"><h1>看一场调查怎样展开。</h1><p>先体验过程，再决定是否交来自己的材料。</p></div><div class="callout"><strong>这里展示教学案例，不冒充真实核查。</strong><p>生产公开案例需有真实来源、调查时间与公开许可。本原型不提供这些证据，因此保留“虚构”标签。</p></div><div class="example-list"><article class="sample"><div class="sample-type">虚构教学案例 / 文字核查</div><h2>“所有公园全天免费”，<br>真的吗？</h2><p style="margin:15px 0">从范围、时段和旧页面，理解一句话怎样被改得面目全非。</p><button class="btn primary" data-action="replay">分步回放 ${icon('arrow')}</button></article><article class="sample"><div class="sample-type">同一案例 / 证据阅读练习</div><h2>当新通知遇到<br>旧收费提示。</h2><p style="margin:15px 0">把两份材料放在一起，看看分歧来自内容，还是来自时间。</p><button class="btn" data-go="conflict">直接看材料对照 ${icon('arrow')}</button></article></div>`}
function render(){const page=location.hash.slice(1)||'home';const m=document.getElementById('modal');if(m.open)m.close();document.getElementById('state-picker').value=page;const views={home,investigation:()=>investigation(),result:()=>result(),source:()=>result(),conflict,interrupted:()=>investigation(true),history,settings,examples,share:()=>result(true)};document.getElementById('app').innerHTML=(views[page]||home)();document.title='红鲱鱼与枪 · '+({home:'首页',investigation:'调查中',result:'结果',source:'来源详情',conflict:'材料对照',interrupted:'中断',history:'历史',settings:'设置',examples:'案例',share:'分享预览'}[page]||'原型');window.scrollTo(0,0);if(page==='source')setTimeout(()=>openSource(1),50);if(page==='home')renderAttachment()}
function renderAttachment(){const e=document.getElementById('attachment');if(e)e.innerHTML=attachment?`<div class="upload-chip"><img src="${attachment.data}" alt="本地图片预览"><span>${esc(attachment.name)}</span><button data-action="remove" aria-label="移除图片">×</button></div>`:''}
document.addEventListener('input',e=>{if(e.target.id==='claim-input')draftStore.setItem('rhg-draft',e.target.value);if(e.target.id==='history-query')document.getElementById('history-items').innerHTML=historyRows(e.target.value)});
document.getElementById('state-picker').addEventListener('change',e=>go(e.target.value));
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-action],[data-source],[data-filter]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.source){openSource(Number(b.dataset.source));return}if(b.dataset.filter){historyFilter=b.dataset.filter;render();return}switch(b.dataset.action){case'close':document.getElementById('modal').close();break;case'fill':{const t=document.getElementById('claim-input');t.value=claim;draftStore.setItem('rhg-draft',claim);t.focus();break}case'link':{const t=document.getElementById('claim-input');t.focus();toast('可把链接贴在输入区。原型不会抓取网页。');break}case'upload':{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const x=f.files[0];if(!x)return;if(x.size>6*1024*1024){toast('示例限制：图片不超过6MB。');return}const r=new FileReader();r.onload=()=>{attachment={name:x.name,data:r.result};renderAttachment()};r.readAsDataURL(x)};f.click();break}case'remove':attachment=null;renderAttachment();break;case'start':{const v=document.getElementById('claim-input').value.trim();if(!v&&!attachment){toast('先放入一句话或图片，或者选择下面的教学案例。');return}modal(`${head('这是一个交互原型')}<p>这里不会核查你的输入，也不会上传它。下面可以演示虚构的“公园免费开放”案例。</p><div class="space"></div><button class="btn primary" data-action="replay">回放教学案例</button>`);break}case'replay':steps=1;go('investigation');break;case'next':if(steps<3){steps++;render()}else go('result');break;case'login':modal(`${head('登录后，把记录带走。')}<p class="login-note">实际产品在这里接现有邮箱登录。原型不收集邮箱，不发送验证码。</p><label class="formfield"><span>邮箱</span><input readonly value="you@example.invalid" aria-label="示例邮箱"></label><button class="btn primary" data-action="demo-login">演示登录反馈</button><div class="space"></div><button class="link" data-go="settings">查看账号与模型设置 ${icon('arrow')}</button>`);break;case'demo-login':toast('仅演示：邮箱登录成功后返回原页面，输入与附件保持。');document.getElementById('modal').close();break;case'share':modal(`${head('先看哪些内容会公开。')}<p>分享包含：示例说法、结果、材料与调查日期。</p><p class="muted" style="margin-top:12px">不包含：账号、密钥、未授权附件与内部日志。本原型不会创建任何公开链接。</p><div class="space"></div><button class="btn primary" data-go="share">预览分享页</button>`);break;case'copy':{const text='【虚构教学案例】只涉及两座试点公园，不是全市，也不是全天。示例日期：2026-09-11。边界：不能用于实际政策判断；仅有教学材料，无真实来源。';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('已复制摘要，包含虚构标签、日期与判断边界。')).catch(()=>showCopy(text));else showCopy(text);break}case'validate':toast('原型不发起网络请求。生产版本在验证完成后才显示成功或具体错误。');break;case'session':toast('原型未存储任何密钥。生产版本在标签页会话内暂存，不写入报告。');break;case'account':modal(`${head('账号与数据')}<p>生产版本在这里复用现有的资料修改、数据导出和账号删除能力，不重造认证。</p><div class="space"></div><button class="btn" data-action="export-note">导出数据</button><button class="link" data-action="delete-note" style="margin-left:15px">删除账号</button>`);break;case'export-note':toast('此原型没有账号数据，未执行导出。');break;case'delete-note':toast('未连接真实账号，不执行删除。生产版需二次确认。');break;case'settings-tab':toast('当前正在查看模型服务设置。');break;}});
function showCopy(text){modal(`${head('复制摘要')}<textarea readonly aria-label="可复制摘要" style="min-height:160px">${esc(text)}</textarea><p class="muted small">浏览器未授予剪贴板权限，请选择文字复制。</p>`)}
window.addEventListener('hashchange',render);render();
</script></body></html>
