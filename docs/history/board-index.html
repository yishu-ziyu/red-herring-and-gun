    ["第二意见回答被长度上限截断（step-3.7-flash stop_reason=max_tokens）", "todo", ""],
    ["余额不足的搜索引擎自动跳过（秘塔返回 200 + 余额不足未被识别）", "todo", ""],
    ["用基线录音离线比较「挑」的几种做法（关键出处进入候选的比例）", "todo", "不花调用费"],
    ["CHEF 大样本复核（本机，不提交数据）", "todo", "调研后新增"],
  ],
};
const tag = s => ({done:'<span class="tag done">完成</span>',doing:'<span class="tag doing">进行中</span>',todo:'<span class="tag todo">待做</span>',open:'<span class="tag open">不做</span>'}[s]||s);
document.getElementById('updated').textContent = DATA.updated;
document.getElementById('metrics').innerHTML = '<tr><th>指标</th><th>怎么量</th><th>基线</th><th>目标</th><th>现在</th></tr>' +
  DATA.metrics.map(m=>`<tr><td>${m[0]}</td><td class="muted">${m[1]}</td><td class="num">${m[2]}</td><td>${m[3]}</td><td class="num">${m[4]||'—'}</td></tr>`).join('');
document.getElementById('gaps').innerHTML = '<tr><th>差距</th><th>现状</th><th>处置</th><th>类型</th><th>状态</th></tr>' +
  DATA.gaps.map(g=>`<tr><td>${g[0]}</td><td class="muted">${g[1]}</td><td>${g[2]}</td><td>${g[3]}</td><td>${tag(g[4])}</td></tr>`).join('');
const card = x => `<div class="item"><div class="k">${x[0]}</div><div class="t">${x[1]}</div><div class="b">${x[2]}</div><div class="r">${x[3]}</div></div>`;
document.getElementById('user').innerHTML = DATA.user.map(card).join('');
document.getElementById('mine').innerHTML = DATA.mine.map(card).join('');
document.getElementById('rules').innerHTML = DATA.rules.map(r=>`<div class="item"><div class="t">${r[1]}</div><div class="b">${r[2]}</div></div>`).join('');
document.getElementById('work').innerHTML = '<tr><th>事项</th><th>状态</th><th>备注</th></tr>' +
  DATA.work.map(w=>`<tr><td>${w[0]}</td><td>${tag(w[1])}</td><td class="muted">${w[2]}</td></tr>`).join('');
</script>
</body>
</html>
