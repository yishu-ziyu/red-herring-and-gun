version: "3.8"

services:
  red-herring-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: red-herring-api
    ports:
      # 只绑回环：外部一律走 nginx(80)，不能直连 3000 绕过反代的可信头
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    # D1：内存存储的 JSON 快照 + 记忆候选 JSONL 挂命名卷，重建容器不丢账号/报告/配额
    volumes:
      - rhg-data:/app/server/.data
      - rhg-memory:/app/server/.agent-memory
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  rhg-data:
  rhg-memory:
