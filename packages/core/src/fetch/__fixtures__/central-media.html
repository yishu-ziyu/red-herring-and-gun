    <h1>人社部回应生育津贴发放方式</h1>
    <p>据人力资源社会保障部消息，生育津贴发放仍按统筹区现行办法执行，不存在全国统一直发个人账户的新规。</p>
    <p>人社部表示，各地不得自行改变发放渠道，也不得以口头通知替代正式文件。</p>
    <p>政策口径详见国务院办公厅通知：<a href="https://www.gov.cn/zhengce/content/2024-03/12/content_gov12.htm">国务院办公厅关于进一步优化政务服务的通知</a>。</p>
    <p>同题报道还可参见<a href="https://www.news.cn/local/same-host.htm">本网地方稿</a>。</p>
  </article>
