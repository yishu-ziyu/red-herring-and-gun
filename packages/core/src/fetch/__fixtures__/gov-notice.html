    <h1>国务院办公厅关于进一步优化政务服务的通知</h1>
    <p>国办发〔2024〕12号</p>
    <p>各省、自治区、直辖市人民政府，国务院各部委、各直属机构：</p>
    <div>为进一步优化政务服务、提升办事效率，经国务院同意，现就有关事项通知如下。</div>
    <p>一、全面推行一件事一次办。各地区各部门要把高频事项集成办理作为重点，减少重复提交材料。</p>
    <p>二、公开办理时限与流程。服务窗口应在显著位置公示法定时限、承诺时限和投诉渠道。</p>
    <p>三、本通知自2024年3月12日起施行。各地执行中的重要情况及时报告国务院办公厅。</p>
  </article>
